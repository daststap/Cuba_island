<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cuba app icon: the island pill on a gradient tile. Source for `tauri icon`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1026" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shine)"/>
  <g filter="url(#shadow)">
    <rect x="212" y="404" width="600" height="216" rx="108" fill="#000"/>
  </g>
  <circle cx="330" cy="512" r="46" fill="#30d158"/>
  <rect x="610" y="462" width="18" height="100" rx="9" fill="#f5f5f7"/>
  <rect x="646" y="482" width="18" height="60" rx="9" fill="#f5f5f7"/>
  <rect x="682" y="447" width="18" height="130" rx="9" fill="#f5f5f7"/>
</svg>
